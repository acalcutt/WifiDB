name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Any syntax error, removed-function fatal or deprecation notice from `php -l` fails the job.
      - name: Lint
        run: |
          output=$(find wifidb -name vendor -prune -o -name "*.php" -exec sh -c 'for f; do php -l "$f"; done' sh {} + 2>&1 | grep -v '^No syntax errors' || true)
          if [ -n "$output" ]; then echo "$output"; exit 1; fi

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress --prefer-dist
      # Unit tests plus a compile of every Smarty template in both themes. No database or config file needed.
      - run: wifidb/wifidb/vendor/bin/phpunit

  # The chart script's date handling, the one piece of JavaScript with logic worth testing.
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check wifidb/wifidb/lib/js/wifidb/signalchart.js
      - run: node --test tests/js/signalchart.test.js
