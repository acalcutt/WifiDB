; The pool for admin/backups.php and admin/backup_transfer.php (wifidb-slow-pool.conf routes them here): downloading a
; whole backup, or another server copying one, can take hours, which the other pools' time limits would cut off. Only
; administrators and servers holding a transfer key get here, so two workers are plenty.
[wdb-backup]
user = www-data
group = www-data
listen = /run/php/wdb-backup.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s
request_terminate_timeout = 0
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 0
php_admin_value[output_buffering] = 0
php_admin_value[zlib.output_compression] = 0
