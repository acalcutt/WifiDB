; The isolated pool for exports, geojson/gpx/kml, tiles and the heavy map, user and search-results pages
; (wifidb-slow-pool.conf routes them here). A small number of workers on purpose: when they are all busy these requests
; queue, and the ordinary pages keep their own pool.
[wdb-slow]
user = www-data
group = www-data
listen = /run/php/wdb-slow.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 200
request_terminate_timeout = 300s
php_admin_value[memory_limit] = 1024M
php_admin_value[max_execution_time] = 300
