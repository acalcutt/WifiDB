# Route WiFiDB's heavy, SQL-bound endpoints to the isolated 'wdb-slow' PHP-FPM pool (/run/php/wdb-slow.sock, defined in
# wifidb-slow-pool-fpm.conf) instead of the interactive 'www' pool, so a big export waiting on the database can never
# starve normal page loads. Included from the vhost.
#
# LocationMatch is URL-path based and, in Apache's section merge order, overrides the global SetHandler in
# conf-enabled/php<version>-fpm.conf. The unanchored "/name.php$" form matches the script whether reached as
# /export.php, /v2/export.php, /api/export.php or /api/v2/export.php.

# Data-export / vector-tile APIs (stream large result sets, wait on SQL)
<LocationMatch "/(export|geojson|tile_geojson|gpx|kml|mvt|mlt)\.php$">
    SetHandler "proxy:unix:/run/php/wdb-slow.sock|fcgi://localhost"
</LocationMatch>

# Heavy interactive pages (map / per-user AP exports / search results). This does NOT catch /opt/search.php: that is
# just the search *form* and stays fast on the 'www' pool; only the query-executing results.php belongs here
# (it was measured at a ~34% failure rate on 'www', killed by its 30s request_terminate_timeout).
<LocationMatch "/opt/(map|userstats|results)\.php$">
    SetHandler "proxy:unix:/run/php/wdb-slow.sock|fcgi://localhost"
</LocationMatch>

# The API's search endpoint when the API is served from its own host and the document root is the api/ directory.
# Anchored so it can't also match /opt/search.php.
<LocationMatch "^/search\.php$">
    SetHandler "proxy:unix:/run/php/wdb-slow.sock|fcgi://localhost"
</LocationMatch>
