; A tiny pool of its own for /health/ready, so a busy www or wdb-slow pool can never starve the readiness check.
; Two workers is plenty for a check run every few seconds, and the hard limit means it can't hang either.
[wdb-health]
user = www-data
group = www-data
listen = /run/php/wdb-health.sock
listen.owner = www-data
listen.group = www-data
pm = static
pm.max_children = 2
pm.max_requests = 500
request_terminate_timeout = 5s
php_admin_value[memory_limit] = 32M
php_admin_value[max_execution_time] = 5
