; A tiny pool of its own for /health/ready, so a busy www or wdb-slow pool can never starve the readiness check.
; Three workers is plenty for a check run every few seconds. The hard limit is 15s: a database name that cannot be resolved takes about 10s to fail, and the page should still get to say so.
[wdb-health]
user = www-data
group = www-data
listen = /run/php/wdb-health.sock
listen.owner = www-data
listen.group = www-data
pm = static
pm.max_children = 3
pm.max_requests = 500
request_terminate_timeout = 15s
php_admin_value[memory_limit] = 32M
php_admin_value[max_execution_time] = 15
