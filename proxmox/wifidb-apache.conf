# WiFiDB site, based on wifidb.net's production vhost. HTTPS is done by the proxy in front of the container (HAProxy
# on OPNsense), so this listens on port 80. wifidb-firstboot adds, as needed:
#   conf-enabled/wifidb-proxy.conf   the proxy's addresses, when WIFIDB_EXTERNAL_PROXY is set (real visitor IPs)
#   conf-enabled/wifidb-root.conf    an Alias, when WIFIDB_ROOT is not empty
#   conf-enabled/wifidb-legacy.conf  the redirect from the old /wifidb/ paths, when WIFIDB_ROOT is empty
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/wifidb

    # General PHP is handled globally by conf-enabled/php<version>-fpm.conf (the www pool), via SetHandler so
    # DirectoryIndex ("/") works. This include routes only the heavy, SQL-bound endpoints (export, geojson, gpx, kml, mvt,
    # mlt, opt/map, opt/userstats, opt/results) to the isolated slow pool, so a burst of them can't starve the rest of the site.
    Include /etc/apache2/wifidb-slow-pool.conf

    <Directory /var/www/wifidb>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Uploaded files wait here for the importer; they are not for download. (The folders also carry .htaccess files.)
    <DirectoryMatch "^/var/www/wifidb/import/up">
        Require all denied
    </DirectoryMatch>

    # Behind a proxy that does TLS, tell PHP the visitor used HTTPS.
    SetEnvIf X-Forwarded-Proto https HTTPS=on

    # Live pages: the websocket daemon listens on 127.0.0.1:9000. The page connects to <WebSocketURL><name>,
    # which wifidb-firstboot sets to https://<site>/ws/<name>.
    ProxyPass        "/ws/LiveAPs"    "ws://127.0.0.1:9000/wifidb/api/LiveAPs"
    ProxyPassReverse "/ws/LiveAPs"    "ws://127.0.0.1:9000/wifidb/api/LiveAPs"
    ProxyPass        "/ws/Scheduling" "ws://127.0.0.1:9000/wifidb/api/Scheduling"
    ProxyPassReverse "/ws/Scheduling" "ws://127.0.0.1:9000/wifidb/api/Scheduling"

    # Small health check for the proxy: GET /health
    AliasMatch "^/health$" /var/www/wifidb-health/index.html
    <Directory /var/www/wifidb-health>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wifidb-error.log
    CustomLog ${APACHE_LOG_DIR}/wifidb-access.log combined

    # ── Flat MVT tiles ───────────────────────────────────────────────────────
    # Written by mvtd for daily/weekly; gzip-compressed protobuf on disk.
    <Directory "/var/www/wifidb/out/tiles">
        <IfModule mod_headers.c>
            <FilesMatch "\.pbf$">
                # Conditional on the response status, NOT "always". A 404 for a tile with no data is the common case
                # at the edge of coverage, and "always" puts Content-Encoding: gzip on that HTML error body -- the
                # client tries to gunzip it, fails with "incorrect header check", and drops the tile's geometry.
                # That is indistinguishable from a rendering bug.
                Header set Content-Type     "application/x-protobuf" "expr=%{REQUEST_STATUS} =~ /^[23]\d\d$/"
                Header set Content-Encoding "gzip"                   "expr=%{REQUEST_STATUS} =~ /^[23]\d\d$/"
                Header set Vary             "Accept-Encoding"
                Header set Access-Control-Allow-Origin  "*"
                Header set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
                Header set Cache-Control    "public, max-age=86400"  "expr=%{REQUEST_STATUS} =~ /^[23]\d\d$/"
            </FilesMatch>
        </IfModule>
        <FilesMatch "\.pbf$">
            SetHandler default-handler
        </FilesMatch>
        Options -Indexes
    </Directory>

    # ── Flat MLT tiles ───────────────────────────────────────────────────────
    # Written by mltd; same shape, different type. Matches what api/mlt.php sends, so a tile is identical whether
    # Apache or PHP served it.
    <Directory "/var/www/wifidb/out/tiles-mlt">
        <IfModule mod_headers.c>
            <FilesMatch "\.mlt$">
                Header set Content-Type     "application/vnd.mapbox-vector-tile" "expr=%{REQUEST_STATUS} =~ /^[23]\d\d$/"
                Header set Content-Encoding "gzip"                               "expr=%{REQUEST_STATUS} =~ /^[23]\d\d$/"
                Header set Vary             "Accept-Encoding"
                Header set Access-Control-Allow-Origin  "*"
                Header set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
                Header set Cache-Control    "public, max-age=86400" "expr=%{REQUEST_STATUS} =~ /^[23]\d\d$/"
            </FilesMatch>
        </IfModule>
        <FilesMatch "\.mlt$">
            SetHandler default-handler
        </FilesMatch>
        Options -Indexes
    </Directory>

    # ── PMTiles archives (MVT) ───────────────────────────────────────────────
    # Not fetched whole: read with Range requests, by pmtiles-swarm as a torrent web seed and by any client using
    # pmtiles://. Three headers are load-bearing here that do not matter for ordinary tiles -- Accept-Ranges, a
    # readable ETag, and CORS.
    <Directory "/var/www/wifidb/out/pmtiles">
        <IfModule mod_mime.c>
            AddType application/vnd.pmtiles .pmtiles
        </IfModule>
        <IfModule mod_headers.c>
            <FilesMatch "\.pmtiles$">
                Header set Accept-Ranges "bytes" "expr=%{REQUEST_STATUS} =~ /^[23]\d\d$/"
                Header set Access-Control-Allow-Origin  "*"
                Header set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
                Header set Access-Control-Allow-Headers "Range, If-None-Match"
                # Expose-Headers is the one that is easy to miss and fails in a confusing way: without it JavaScript
                # cannot read the ETag at all, so pmtiles.js loses its only means of noticing the archive changed
                # underneath it and silently mixes bytes from two builds.
                Header set Access-Control-Expose-Headers "ETag, Content-Length, Content-Range, Accept-Ranges"
                # Short and revalidating: the dated names are immutable, but {bucket}.pmtiles is a stable name whose
                # contents change every build. A 304 costs one round trip; serving a stale archive body against a
                # fresh directory is not a failure a client can detect.
                Header set Cache-Control "public, max-age=300, must-revalidate" "expr=%{REQUEST_STATUS} =~ /^[23]\d\d$/"
            </FilesMatch>
        </IfModule>
        # No inode, so two nodes serving byte-identical archives agree. The sync must preserve mtimes for that to
        # hold -- rsync -t or -a.
        FileETag MTime Size
        Options -Indexes
        # Build state, not output. mvtd writes {bucket}.pmtiles.building and the writer's scratch files beside the
        # finished archive, because an atomic rename needs the same filesystem. A half-written archive served to a
        # client parses as a valid header pointing at bytes that are not there yet.
        <FilesMatch "\.(building|tmp)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # ── PMTiles archives (MLT) ───────────────────────────────────────────────
    # The container is PMTiles either way; only the payload inside each tile differs, declared by tile_type 0x06 in
    # the archive header.
    <Directory "/var/www/wifidb/out/pmtiles-mlt">
        <IfModule mod_mime.c>
            AddType application/vnd.pmtiles .pmtiles
        </IfModule>
        <IfModule mod_headers.c>
            <FilesMatch "\.pmtiles$">
                Header set Accept-Ranges "bytes" "expr=%{REQUEST_STATUS} =~ /^[23]\d\d$/"
                Header set Access-Control-Allow-Origin  "*"
                Header set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
                Header set Access-Control-Allow-Headers "Range, If-None-Match"
                Header set Access-Control-Expose-Headers "ETag, Content-Length, Content-Range, Accept-Ranges"
                Header set Cache-Control "public, max-age=300, must-revalidate" "expr=%{REQUEST_STATUS} =~ /^[23]\d\d$/"
            </FilesMatch>
        </IfModule>
        FileETag MTime Size
        Options -Indexes
        <FilesMatch "\.(building|tmp)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
