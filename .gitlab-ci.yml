# Runs on the Docker-executor runner from gitlab-runner-install (tag: linux).
# Every job starts from a plain php:<version>-cli image, so nothing needs to be installed on the runner.

stages:
  - lint
  - test
  - package

default:
  tags: [linux]
  interruptible: true

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

# Supported PHP branches. 8.1 and earlier are out of security support.
.php-matrix:
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.3", "8.4", "8.5"]
  image: php:${PHP_VERSION}-cli

# Any syntax error, removed-function fatal or deprecation notice from `php -l` fails the job.
lint:
  extends: .php-matrix
  stage: lint
  script:
    - |
      output=$(find wifidb -name "*.php" -exec sh -c 'for f; do php -l "$f"; done' sh {} + 2>&1 | grep -v '^No syntax errors' || true)
      if [ -n "$output" ]; then echo "$output"; exit 1; fi
      echo "All PHP files parse cleanly on PHP ${PHP_VERSION}."

# Unit tests plus a compile of every Smarty template in both themes. No database or config file needed.
phpunit:
  extends: .php-matrix
  stage: test
  cache:
    key: composer-${PHP_VERSION}
    paths:
      - .composer-cache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer --quiet
    - composer install --no-interaction --no-progress --prefer-dist
  script:
    - vendor/bin/phpunit --log-junit phpunit-report.xml
  artifacts:
    when: always
    reports:
      junit: phpunit-report.xml

# The Proxmox LXC template (proxmox/, docs/proxmox.md): built, then boot-tested against a MariaDB container.
# Needs the Linux runner registered with --privileged (gitlab-runner-install: install-linux-runner.sh --privileged),
# for Docker-in-Docker and a systemd container. Runs on the default branch; start it by hand on a merge request.
proxmox-template:
  stage: package
  tags: [linux, docker]
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: /certs
  timeout: 2h
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache bash coreutils curl git tar zstd
    - for i in $(seq 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
  script:
    - git archive --format=tar.gz -o wifidb-src.tar.gz HEAD wifidb
    - mkdir -p out
    - bash proxmox/build-template.sh wifidb-src.tar.gz "out/WifiDB-${CI_COMMIT_SHORT_SHA}-proxmox-amd64.tar.zst"
    - bash proxmox/test-template.sh "out/WifiDB-${CI_COMMIT_SHORT_SHA}-proxmox-amd64.tar.zst"
  artifacts:
    when: always
    paths:
      - out/
    expire_in: 7 days
